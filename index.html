<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan Harian</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#efefef;--sf:#fff;--ink:#000;--mute:#5c5c5c;--line:#cfcfcf;--inc:#000;--exp:#000;--inc-bg:#e4e4e4;--exp-bg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--sf:#141414;--ink:#fff;--mute:#9a9a9a;--line:#2e2e2e;--inc:#fff;--exp:#fff;--inc-bg:#262626;--exp-bg:#0a0a0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--sf:#141414;--ink:#fff;--mute:#9a9a9a;--line:#2e2e2e;--inc:#fff;--exp:#fff;--inc-bg:#262626;--exp-bg:#0a0a0a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.3rem;font-weight:800;margin:0}
input,select,button{font:inherit;color:inherit}
input[type=month]{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.balance{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px}
.balance small{opacity:.7;display:block}
.balance .big{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 14px;word-break:break-all}
.row{display:flex;gap:10px}
.row>div{flex:1;border-radius:10px;padding:10px 12px;font-weight:600}
.row small{font-weight:400}
.i{background:var(--inc-bg);color:var(--inc)}.e{background:var(--exp-bg);color:var(--exp)}
.today{margin:10px 2px 18px;color:var(--mute);font-size:.92rem}
.card{background:var(--sf);border:2px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);padding:16px;margin-bottom:20px}
h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .w{grid-column:1/-1}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:3px}
.f input,.f select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.f input:focus,.f select:focus,button:focus-visible,input[type=month]:focus{outline:2px solid var(--inc);outline-offset:1px}
.save{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;background:var(--ink);color:var(--bg);font-weight:800;cursor:pointer}
.err{color:var(--exp);font-size:.85rem;min-height:1.2em;margin-top:6px}
.cat{margin-bottom:9px;font-size:.9rem}
.cat .t{display:flex;justify-content:space-between}
.bar{height:6px;background:var(--bg);border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--exp)}
.day{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);margin:14px 0 4px}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-weight:600}
.tx .m span{color:var(--mute);font-size:.82rem;overflow-wrap:anywhere}
.tx .a{font-weight:600;white-space:nowrap}
.tx .d{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.2rem;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;display:block;margin:8px auto 0;font-size:.85rem}
body{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.who{display:flex;align-items:center;gap:12px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dt{font-size:.8rem;color:var(--mute)}
.balance{position:relative;overflow:hidden;box-shadow:4px 4px 0 var(--mute);border-radius:6px;margin-bottom:6px}
.balance::after{content:"";position:absolute;top:0;right:0;width:120px;height:120px;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(128,128,128,.5) 6px 8px);clip-path:polygon(100% 0,0 0,100% 100%);pointer-events:none}
.rl{display:flex;justify-content:space-between;font-size:.8rem;margin-top:14px;opacity:.85}
.ratio{height:8px;border:1px solid var(--bg);border-radius:4px;margin-top:4px;overflow:hidden}
.ratio i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--bg) 0 4px,transparent 4px 6px);transition:width .4s}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
.chips div{background:var(--sf);border:2px solid var(--ink);border-radius:6px;padding:8px 10px}
.chips small{display:block;font-size:.7rem;color:var(--mute);line-height:1.2;margin-bottom:2px}
.chips b{font-size:.95rem;overflow-wrap:anywhere}
.bar{border:1px solid var(--ink)}
.bar i{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,transparent 4px 6px)}
.seg{border:2px solid var(--ink)}
.row>div{border-radius:4px}
.bk{display:flex;gap:8px;flex-wrap:wrap}
.bk button{flex:1;border:2px solid var(--ink);background:var(--sf);color:var(--ink);border-radius:6px;padding:10px;font-weight:600;cursor:pointer}
.bk button:first-child{background:var(--ink);color:var(--bg)}
#bkTxt{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px;font-size:.75rem}
</style>
</head>
<body>
<main>
<header><div class="who"><div><h1 class="sr">Yhozi Mamondol</h1><div class="logo" role="img" aria-label="Logo Yhozi Mamondol"></div><div class="dt" id="hdate"></div><div class="dt" id="sst"></div></div></div><input type="month" id="mon" aria-label="Pilih bulan"></header>

<section class="balance">
<small>Balance</small><div class="big" id="bal">Rp0</div>
<div class="row"><div class="i"><small>Pemasukan</small><div id="sin">Rp0</div></div><div class="e"><small>Pengeluaran</small><div id="sout">Rp0</div></div></div>
<div class="rl"><span>Pengeluaran dari pemasukan</span><span id="rtx">0%</span></div><div class="ratio"><i id="rt"></i></div>
</section>
<p class="today" id="today"></p>
<div class="chips"><div><small>Transaksi</small><b id="cN">0</b></div><div><small>Rata-rata keluar per hari</small><b id="cA">Rp0</b></div></div>

<section class="card">
<h2>Catat transaksi</h2>
<div class="seg" role="group" aria-label="Jenis transaksi"><button type="button" class="on e" id="bE">Pengeluaran</button><button type="button" class="i" id="bI">Pemasukan</button></div>
<div class="f">
<div class="w"><label for="amt">Jumlah (Rp)</label><input id="amt" inputmode="numeric" placeholder="0" autocomplete="off"></div>
<div><label for="cat">Kategori</label><select id="cat"></select></div>
<div><label for="dt">Tanggal</label><input type="date" id="dt"></div>
<div class="w"><label for="note">Catatan (opsional)</label><input id="note" placeholder="Misalnya makan siang" maxlength="80"></div>
</div>
<div class="err" id="err" role="alert"></div>
<button class="save" id="save">Simpan transaksi</button>
</section>

<section class="card" id="catCard"><h2>Pengeluaran per kategori</h2><div id="cats"></div></section>

<section class="card"><h2>Riwayat transaksi</h2><div id="list"></div></section>
<section class="card"><h2>Cadangan data</h2>
<p class="dt" style="margin:0 0 10px">Simpan semua catatan ke file, atau pulihkan dari file cadangan sebelumnya.</p>
<div class="bk"><button type="button" id="bkSave">Simpan cadangan</button><button type="button" id="bkLoad">Pulihkan dari file</button><button type="button" id="bkPaste">Pulihkan dari teks</button><input type="file" id="bkFile" accept=".json,application/json" hidden></div>
<div class="err" id="bkMsg" role="status"></div><textarea id="bkTxt" hidden rows="5" aria-label="Isi cadangan"></textarea></section>
<button class="reset" id="reset">Hapus semua data</button>
</main>
<script>
const CATS={e:["Makanan & minuman","Transportasi","Belanja","Tagihan","Hiburan","Kesehatan","Tabungan","Lainnya"],i:["Gaji","Bonus","Usaha","Hadiah","Tarik tabungan","Lainnya"]};
const KEY="keuangan-harian-v1";
let tx=[],type="e";
try{tx=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(tx))tx=[]}catch(e){tx=[]}
const $=id=>document.getElementById(id);
const rp=n=>(n<0?"-":"")+"Rp"+Math.abs(n).toLocaleString("id-ID");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}sync()}
let col=null,saved={};
function setSst(m){const e=$("sst");if(e)e.textContent=m}
function sync(){
 if(!col)return;
 const g={};tx.forEach(t=>{const k="m-"+t.date.slice(0,7);(g[k]=g[k]||[]).push(t)});
 Object.keys(saved).forEach(k=>{if(!g[k])g[k]=[]});
 Object.keys(g).forEach(k=>{const j=JSON.stringify(g[k]);if(saved[k]===j)return;saved[k]=j;
  col.doc(k).set({tx:g[k]}).then(()=>setSst("Tersimpan di akun Anda")).catch(()=>{saved[k]=null;setSst("Gagal menyimpan ke akun, data aman di perangkat ini")})})}
async function initCloud(){
 const MK="keuangan-harian-cloud1";
 setSst("Menyambungkan ke akun…");
 const timer=setTimeout(()=>setSst("Belum tersambung, data disimpan di perangkat ini"),10000);
 try{
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  const uid=u?await u.id():null;
  if(!d||!uid){clearTimeout(timer);setSst("Data disimpan di perangkat ini saja");return}
  col=d.collection("data/users/"+uid);
  let first=true;
  col.onSnapshot(snap=>{
   clearTimeout(timer);
   const all=[],cur={};
   snap.docs.forEach(x=>{const t=(x.data()||{}).tx;if(Array.isArray(t)){all.push(...t);cur[x.id]=JSON.stringify(t)}});
   const wasFirst=first;first=false;
   if(wasFirst){
    let mig=null;try{mig=localStorage.getItem(MK)}catch(e){}
    if(all.length){
     if(!mig){const ids=new Set(all.map(t=>t.id));tx.forEach(t=>{if(!ids.has(t.id))all.push(t)})}
     tx=all;saved=cur;
    }else saved={};
    try{localStorage.setItem(MK,"1")}catch(e){}
   }else{tx=all;saved=cur}
   try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}
   if(wasFirst)sync();
   render();setSst("Tersimpan di akun Anda");
  },()=>{clearTimeout(timer);setSst("Gagal tersambung ke akun, data disimpan di perangkat ini")});
 }catch(e){clearTimeout(timer);setSst("Data disimpan di perangkat ini saja")}
}
function setType(t){type=t;$("bE").className=t=="e"?"on e":"e";$("bI").className=t=="i"?"on i":"i";
 $("cat").innerHTML=CATS[t].map(c=>`<option>${esc(c)}</option>`).join("")}
$("bE").onclick=()=>setType("e");$("bI").onclick=()=>setType("i");
$("amt").oninput=e=>{const v=e.target.value.replace(/\D/g,"");e.target.value=v?Number(v).toLocaleString("id-ID"):""};
$("save").onclick=()=>{
 const amt=Number($("amt").value.replace(/\D/g,""));
 if(!amt){$("err").textContent="Masukkan jumlah lebih dari 0.";return}
 if(!$("dt").value){$("err").textContent="Pilih tanggal transaksi.";return}
 $("err").textContent="";
 tx.push({id:Date.now()+Math.random(),type,amt,cat:$("cat").value,note:$("note").value.trim(),date:$("dt").value});
 persist();$("amt").value="";$("note").value="";
 if($("dt").value.slice(0,7)!==$("mon").value)$("mon").value=$("dt").value.slice(0,7);
 render();$("amt").focus()};
$("mon").onchange=render;
$("reset").onclick=()=>{if(confirm("Hapus semua catatan? Data tidak bisa dikembalikan.")){tx=[];persist();render()}};
function render(){
 const m=$("mon").value||iso(new Date()).slice(0,7);
 const cur=tx.filter(t=>t.date.slice(0,7)===m);
 const sum=k=>cur.filter(t=>t.type===k).reduce((a,t)=>a+t.amt,0);
 const inc=sum("i"),out=sum("e");
 $("bal").textContent=rp(inc-out);$("sin").textContent=rp(inc);$("sout").textContent=rp(out);
 $("rt").style.width=(inc?Math.min(100,out/inc*100):(out?100:0))+"%";$("rtx").textContent=(inc?Math.round(out/inc*100):0)+"%";
 $("cN").textContent=cur.length;
 const dim=m===iso(new Date()).slice(0,7)?new Date().getDate():new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
 $("cA").textContent=rp(Math.round(out/dim));
 const td=iso(new Date()),tt=tx.filter(t=>t.date===td);
 const ti=tt.filter(t=>t.type=="i").reduce((a,t)=>a+t.amt,0),to=tt.filter(t=>t.type=="e").reduce((a,t)=>a+t.amt,0);
 $("today").textContent=tt.length?`Hari ini: masuk ${rp(ti)}, keluar ${rp(to)}.`:"Belum ada transaksi hari ini.";
 const by={};cur.filter(t=>t.type=="e").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 $("cats").innerHTML=ents.length?ents.map(([c,v])=>`<div class="cat"><div class="t"><span>${esc(c)}</span><span>${rp(v)} (${Math.round(v/out*100)}%)</span></div><div class="bar"><i style="width:${v/out*100}%"></i></div></div>`).join(""):'<div class="empty">Belum ada pengeluaran bulan ini.</div>';
 if(!cur.length){$("list").innerHTML='<div class="empty">Belum ada transaksi. Isi formulir di atas untuk mulai mencatat.</div>';return}
 const days={};cur.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
 $("list").innerHTML=Object.keys(days).sort().reverse().map(d=>{
  const arr=days[d],net=arr.reduce((a,t)=>a+(t.type=="i"?t.amt:-t.amt),0);
  const lbl=new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
  return `<div class="day"><span>${lbl}</span><span>${rp(net)}</span></div>`+arr.slice().reverse().map(t=>
   `<div class="tx"><div class="m"><b>${esc(t.cat)}</b>${t.note?`<span>${esc(t.note)}</span>`:""}</div><div class="a" style="color:var(--${t.type=="i"?"inc":"exp"})">${t.type=="i"?"+":"-"}${rp(t.amt)}</div><button class="d" data-id="${t.id}" aria-label="Hapus transaksi">×</button></div>`).join("")}).join("");
 document.querySelectorAll(".d").forEach(b=>b.onclick=()=>{tx=tx.filter(t=>String(t.id)!==b.dataset.id);persist();render()})}
$("dt").value=iso(new Date());$("mon").value=iso(new Date()).slice(0,7);
$("bkSave").onclick=async()=>{
 const json=JSON.stringify({app:"keuangan-harian",saved:iso(new Date()),tx},null,1);
 const fn="cadangan-keuangan-"+iso(new Date())+".json";
 try{
  if(navigator.canShare&&window.File){const f=new File([json],fn,{type:"application/json"});
   if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});$("bkMsg").textContent="Pilih Simpan ke File, atau kirim ke WhatsApp Anda sendiri.";return}}
 }catch(e){if(e&&e.name==="AbortError")return}
 const t=$("bkTxt");t.hidden=false;t.value=json;t.focus();t.select();
 let c=false;try{await navigator.clipboard.writeText(json);c=true}catch(e){}
 $("bkMsg").textContent=c?"Cadangan sudah disalin. Tempel ke aplikasi Catatan atau kirim ke diri sendiri lewat WhatsApp.":"Tekan lama pada teks di kotak, pilih Salin, lalu tempel ke aplikasi Catatan atau WhatsApp."};
$("bkLoad").onclick=()=>$("bkFile").click();
async function importText(txt){
 try{
  const o=JSON.parse(txt);const arr=Array.isArray(o)?o:o.tx;
  const ok=Array.isArray(arr)?arr.filter(t=>t&&(t.type==="i"||t.type==="e")&&Number(t.amt)>0&&/^\d{4}-\d\d-\d\d$/.test(t.date)&&t.cat):[];
  if(!ok.length){$("bkMsg").textContent="File tidak berisi transaksi yang valid.";return}
  const ids=new Set(tx.map(t=>String(t.id)));const add=ok.filter(t=>!ids.has(String(t.id)));
  if(!add.length){$("bkMsg").textContent="Semua transaksi di file ini sudah ada.";return}
  if(!confirm("Tambahkan "+add.length+" transaksi dari cadangan? Data yang sudah ada tidak dihapus."))return;
  add.forEach(t=>tx.push({id:t.id!=null?t.id:Date.now()+Math.random(),type:t.type,amt:Number(t.amt),cat:String(t.cat),note:String(t.note||""),date:t.date}));
  persist();render();$("bkMsg").textContent=add.length+" transaksi dipulihkan."
 }catch(err){$("bkMsg").textContent="File tidak bisa dibaca. Pastikan itu isi cadangan yang benar."}};
$("bkFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f)importText(await f.text())};
$("bkPaste").onclick=()=>{const t=$("bkTxt");if(t.hidden||!t.value.trim()){t.hidden=false;t.value="";t.placeholder="Tempel isi cadangan di sini, lalu tekan Pulihkan dari teks lagi.";t.focus();return}importText(t.value)};
$("hdate").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
setType("e");render();
try{localStorage.setItem("_t","1");localStorage.removeItem("_t");setSst("Data tersimpan di perangkat ini")}catch(e){setSst("Browser ini tidak bisa menyimpan otomatis. Pakai Simpan cadangan.")}
</script>
